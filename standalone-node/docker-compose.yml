# Cypher Blockchain Test Network - Docker Compose Configuration
# 
# This configuration sets up a complete test network for the Cypher blockchain
# with multiple nodes including validators and regular nodes.
#
# QUICK START:
# ------------
# 1. Start the entire network:
#    docker-compose up
#
# 2. Start in detached mode (background):
#    docker-compose up -d
#
# 3. Scale validators dynamically:
#    docker-compose up --scale validator-1=5
#    (This will create 5 validator instances)
#
# 4. View logs:
#    docker-compose logs -f [service-name]
#
# 5. Stop the network:
#    docker-compose down
#
# 6. Stop and remove all data:
#    docker-compose down -v
#
# NETWORK ARCHITECTURE:
# ---------------------
# - bootstrap-node: The first node in the network that others connect to
# - validator-1, validator-2: Validator nodes that participate in consensus
# - regular-node: A non-validator node that synchronizes with the network
#
# DATA PERSISTENCE:
# -----------------
# Each node has its own named volume for persistent storage:
# - bootstrap-data: Bootstrap node blockchain data
# - validator1-data: Validator 1 blockchain data
# - validator2-data: Validator 2 blockchain data
# - regular-data: Regular node blockchain data
#
# Data persists across container restarts unless explicitly removed with -v flag
#
# NETWORK ISOLATION:
# ------------------
# All nodes run on an isolated bridge network (cypher-network)
# This ensures nodes can only communicate with each other and not with
# other Docker containers or the host network (except through exposed ports)

version: '3.8'

services:
  # Bootstrap Node - The first node that starts the network
  # Other nodes connect to this node to join the network
  bootstrap-node:
    build: .
    ports:
      - "8333:8333"  # P2P network port
      - "3000:3000"  # API/RPC port
    environment:
      - NODE_TYPE=bootstrap
      - PORT=8333
      - API_PORT=3000
    volumes:
      - bootstrap-data:/app/data
    networks:
      - cypher-network
    restart: unless-stopped

  # Validator Node 1 - Participates in consensus and block production
  validator-1:
    build: .
    ports:
      - "8334:8333"  # P2P network port (mapped to different host port)
      - "3001:3000"  # API/RPC port (mapped to different host port)
    environment:
      - NODE_TYPE=validator
      - PORT=8333
      - API_PORT=3000
      - VALIDATOR=true
      - MINING_ADDRESS=0xvalidator1
      - BOOTSTRAP=bootstrap-node:8333
    volumes:
      - validator1-data:/app/data
    depends_on:
      - bootstrap-node
    networks:
      - cypher-network
    restart: unless-stopped

  # Validator Node 2 - Another validator for consensus diversity
  validator-2:
    build: .
    ports:
      - "8335:8333"  # P2P network port
      - "3002:3000"  # API/RPC port
    environment:
      - NODE_TYPE=validator
      - PORT=8333
      - API_PORT=3000
      - VALIDATOR=true
      - MINING_ADDRESS=0xvalidator2
      - BOOTSTRAP=bootstrap-node:8333
    volumes:
      - validator2-data:/app/data
    depends_on:
      - bootstrap-node
    networks:
      - cypher-network
    restart: unless-stopped

  # Regular Node - Non-validator node that syncs with the network
  regular-node:
    build: .
    ports:
      - "8336:8333"  # P2P network port
      - "3003:3000"  # API/RPC port
    environment:
      - NODE_TYPE=regular
      - PORT=8333
      - API_PORT=3000
      - BOOTSTRAP=bootstrap-node:8333
    volumes:
      - regular-data:/app/data
    depends_on:
      - bootstrap-node
    networks:
      - cypher-network
    restart: unless-stopped

# Named volumes for persistent blockchain data
# These volumes persist even when containers are stopped
volumes:
  bootstrap-data:
    driver: local
  validator1-data:
    driver: local
  validator2-data:
    driver: local
  regular-data:
    driver: local

# Isolated network for all Cypher nodes
# Provides network isolation and enables service discovery by name
networks:
  cypher-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16